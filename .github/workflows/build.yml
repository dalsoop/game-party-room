name: build-party-room

# Multi-platform build for public Party Room repo.
# Root .github/workflows required — nested apps/**/.github is ignored by GitHub.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

defaults:
  run:
    working-directory: apps/game-party-room-app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PartyRoom-android-apk
          path: apps/game-party-room-app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows release
        shell: pwsh
        run: |
          $src = "apps/game-party-room-app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$src/*" -DestinationPath "PartyRoom-windows.zip" -Force
        working-directory: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: PartyRoom-windows-zip
          path: PartyRoom-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Locate app bundle
        id: app
        run: |
          if [ -d "build/macos/Build/Products/Release/PartyRoom.app" ]; then
            echo "path=apps/game-party-room-app/build/macos/Build/Products/Release/PartyRoom.app" >> "$GITHUB_OUTPUT"
          else
            echo "path=apps/game-party-room-app/build/macos/Build/Products/Release/game_party_room_app.app" >> "$GITHUB_OUTPUT"
          fi
        working-directory: apps/game-party-room-app
      - uses: actions/upload-artifact@v4
        with:
          name: PartyRoom-macos-app
          path: ${{ steps.app.outputs.path }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-base \
            liblzma-dev clang cmake pkg-config
        working-directory: ${{ github.workspace }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: PartyRoom-linux-bundle
          path: apps/game-party-room-app/build/linux/x64/release/bundle/

  # Unsigned iOS .app only — real distribute needs Apple account / TestFlight
  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: PartyRoom-ios-unsigned
          path: apps/game-party-room-app/build/ios/iphoneos/Runner.app
