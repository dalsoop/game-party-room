name: party_room_server
description: "파티룸 방 서버 — Flutter 없이 도는 순수 Dart. 호스트 앱과 헤드리스 서버가 같은 코드를 쓴다."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  party_room_relay:
    path: ../party_room_relay
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  meta: ^1.15.0

dev_dependencies:
  # 테스트에서 가짜 소켓을 만든다 — WebSocketChannel 구현에 필요.
  stream_channel: ^2.1.2
  test: ^1.25.0
  lints: ^6.0.0
